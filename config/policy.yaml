# =============================================================================
# policy.yaml — the ONLY source of a risk number in this system.
#
# SPEC-P1.3-CONFIG v0.1. Loaded by src/config/loader.py and by nothing else.
# No code path reads a risk number from an environment variable, a constant, or a
# literal (SPEC-P1.3 §7; enforced by tests/verify_p13_no_env_risk.py).
#
# Every rule carries the frozen authority it derives from. A rule with no
# authority is a rule someone invented, and the loader rejects it.
#
# CONVENTIONS, fixed upstream and not re-litigated here:
#   *_pct is a FRACTION in [0,1], never integer percent   (P0.1 §6, P0.3 §15.1)
#   limits are INCLUSIVE: `lte 0.05` PASSES at exactly 0.05, breach is > 0.05 (P0.1 §6)
#   windows count COMPLETED EXCHANGE SESSIONS, never calendar days  (P0.1 §6)
#   money is Decimal, quantised to the currency's minor units       (P1.1 §3.2)
# =============================================================================

schema_version: 1
policy_version: "0.1.0"

metadata:
  description: >-
    Deterministic policy layer read by the risk engine (P2.9) and the kill switch
    (P2.10). Every constitutional risk number appears here exactly once.
  authored_by: "JS — Project Owner"
  authored_at: "2026-08-27T00:00:00Z"

# -----------------------------------------------------------------------------
# 1. GOVERNANCE — who may change what, and how many people it takes.
# -----------------------------------------------------------------------------
governance:
  # Tightening a limit is ALWAYS safe and needs no approval (ADR-09 row 3).
  min_approvals_to_tighten: 0
  # Loosening requires TWO DISTINCT approver identities.
  #
  # ADR-09 row 2 authorises the Owner alone to increase a limit. Requiring two is
  # therefore STRICTER than the frozen ADR, and ADR-09 row 3's "tightening is
  # always safe" is exactly what makes a stricter control permissible without a
  # constitutional amendment.
  #
  # OPERATIONAL CONSEQUENCE, stated rather than discovered: at team size 1
  # (ADR-09, [DEFAULT-3] of P0.1) this makes limit increases IMPOSSIBLE until a
  # second approver is enrolled. That is deliberate and it is safe — every
  # emergency action available to a single operator is a tightening or a kill,
  # and both remain unblocked.
  min_approvals_to_loosen: 2
  # There is NO approval count that permits overriding a single risk DENY.
  # ADR-09's final row: no approver, no code path. Immutable.
  risk_deny_override_permitted: false
  approver_roles: [OWNER]
  signature:
    algorithm: ed25519
    # Detached signature over the canonical content hash (SPEC-P1.3 §5.2).
    public_key_ref: "vault://kv/data/trading/policy-signing#public_key"
    required: true

# -----------------------------------------------------------------------------
# 2. LAYERING — resolution order, lowest precedence first.
#    Later layers override earlier ones, key by key (SPEC-P1.3 §6).
# -----------------------------------------------------------------------------
layering:
  order: [defaults, market, environment, operator_override]
  # The operator_override layer exists for operational knobs only. Any attempt to
  # override a key under `rules.*` is a LOAD FAILURE, not a warning: an operator
  # who can loosen a limit at runtime has defeated [CONST-1] and ADR-09 alike.
  operator_override_denied_prefixes:
    - "rules."
    - "governance."
    - "kill_switch."

# -----------------------------------------------------------------------------
# 3. SECRETS — never a literal in this file (SPEC-P1.3 §8).
#    Syntax: vault://<mount>/<path>#<key>
#    Resolved at load, held in memory only, never written to the effective-config
#    dump, never logged, never included in the content hash input.
# -----------------------------------------------------------------------------
secret_refs:
  broker_us_key: "vault://kv/data/trading/alpaca#api_key"
  broker_us_secret: "vault://kv/data/trading/alpaca#api_secret"
  broker_in_key: "vault://kv/data/trading/zerodha#api_key"
  broker_in_secret: "vault://kv/data/trading/zerodha#api_secret"
  llm_primary_key: "vault://kv/data/trading/openai#api_key"
  llm_fallback_key: "vault://kv/data/trading/deepseek#api_key"
  marketdata_key: "vault://kv/data/trading/massive#api_key"

